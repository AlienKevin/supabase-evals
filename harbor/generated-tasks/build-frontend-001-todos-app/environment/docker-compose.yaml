services:
  main:
    network_mode: host
    command: ["bash", "-lc", "mkdir -p /app; cp -a /opt/task-seed/. /app/; touch /app/.harbor-host-workspace; exec sleep infinity"]
    volumes:
      # Match the source harness's live workspace bind. Supabase CLI launches
      # Edge Runtime as a sibling container on this daemon, so both processes
      # must resolve the same absolute /app path.
      - /app:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SUPABASE_EXCLUDED_SERVICES: ""
      SUPABASE_PRESTART: "0"
